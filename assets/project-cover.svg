<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
<title id="title">Smart Compressor project cover</title>
<desc id="desc">Industrial data-compression identity showing files converging into a compact archive core.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071116"/>
    <stop offset="0.55" stop-color="#0B1B23"/>
    <stop offset="1" stop-color="#102832"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5AF2E9"/>
    <stop offset="1" stop-color="#16BFC4"/>
  </linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFC06A"/>
    <stop offset="1" stop-color="#FF8B2C"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".08"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/>
  </linearGradient>
  <radialGradient id="glowA">
    <stop offset="0" stop-color="#22D3D0" stop-opacity=".18"/>
    <stop offset="1" stop-color="#22D3D0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB">
    <stop offset="0" stop-color="#FF9D42" stop-opacity=".16"/>
    <stop offset="1" stop-color="#FF9D42" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".032"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".48"/>
  </filter>
</defs>

<rect width="1600" height="640" rx="34" fill="url(#bg)"/>
<rect width="1600" height="640" rx="34" fill="url(#grid)"/>
<circle cx="1260" cy="220" r="340" fill="url(#glowA)"/>
<circle cx="1440" cy="520" r="250" fill="url(#glowB)"/>

<g transform="translate(92 94)">
  <rect width="216" height="38" rx="19" fill="#22D3D0" fill-opacity=".08" stroke="#22D3D0" stroke-opacity=".35"/>
  <circle cx="24" cy="19" r="5" fill="#22D3D0"/>
  <text x="41" y="25" fill="#99FFF7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.9">STANDARD LIBRARY CORE</text>

  <text x="0" y="144" fill="#F4F7F6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="78" font-weight="850" letter-spacing="-4">Smart</text>
  <text x="218" y="144" fill="url(#cyan)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="78" font-weight="850" letter-spacing="-4">Compressor</text>

  <text x="2" y="194" fill="#B8C9CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500">Compress. Inspect. Extract. Keep the archive under control.</text>

  <g transform="translate(0 242)">
    <rect width="152" height="44" rx="22" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="24" y="28" fill="#EAF1F2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">ZIP / TAR</text>
    <rect x="166" width="180" height="44" rx="22" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="190" y="28" fill="#EAF1F2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Safe extraction</text>
    <rect x="360" width="178" height="44" rx="22" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="384" y="28" fill="#EAF1F2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">JSON inspect</text>
  </g>

  <g transform="translate(0 378)">
    <text x="0" y="0" fill="#7F99A0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.6">A RADWAN ABD ALHADY PROJECT</text>
    <text x="0" y="40" fill="#F4F7F6" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="700">رضوان عبدالهادي</text>
    <text x="0" y="72" fill="#AFC0C4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Radwan Abd alhady Ahmed</text>
  </g>
</g>

<g transform="translate(965 102)" filter="url(#shadow)">
  <g opacity=".78">
    <rect x="0" y="120" width="190" height="248" rx="26" fill="#0D1B21" stroke="#FFFFFF" stroke-opacity=".10" transform="rotate(-8 95 244)"/>
    <rect x="42" y="84" width="190" height="248" rx="26" fill="#10252D" stroke="#22D3D0" stroke-opacity=".24" transform="rotate(4 137 208)"/>
  </g>

  <g transform="translate(86 76)">
    <rect width="210" height="270" rx="28" fill="#0E1D24" stroke="#FFFFFF" stroke-opacity=".13"/>
    <path d="M156 0h26a28 28 0 0 1 28 28v34z" fill="#22D3D0" fill-opacity=".16"/>
    <rect x="32" y="62" width="112" height="13" rx="6.5" fill="#EAF1F2" fill-opacity=".74"/>
    <rect x="32" y="98" width="144" height="9" rx="4.5" fill="#EAF1F2" fill-opacity=".16"/>
    <rect x="32" y="123" width="120" height="9" rx="4.5" fill="#EAF1F2" fill-opacity=".11"/>
    <rect x="32" y="164" width="146" height="58" rx="16" fill="#22D3D0" fill-opacity=".08" stroke="#22D3D0" stroke-opacity=".22"/>
    <path d="M57 193h96" stroke="#5AF2E9" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(315 174)">
    <path d="M0 52h82" stroke="#FF9D42" stroke-width="7" stroke-linecap="round"/>
    <path d="M52 24 82 52 52 80" fill="none" stroke="#FF9D42" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 110h52" stroke="#22D3D0" stroke-width="6" stroke-linecap="round"/>
    <path d="M26 94 12 110l14 16M56 94l14 16-14 16" fill="none" stroke="#22D3D0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(420 128)">
    <rect width="240" height="300" rx="42" fill="#0B171D" stroke="#22D3D0" stroke-opacity=".42"/>
    <rect x="38" y="44" width="164" height="160" rx="34" fill="#10262E" stroke="#FFFFFF" stroke-opacity=".10"/>
    <path d="M64 88h112M64 121h112M64 154h112" stroke="#22D3D0" stroke-opacity=".75" stroke-width="10" stroke-linecap="round"/>
    <path d="M87 72v104M120 72v104M153 72v104" stroke="#FF9D42" stroke-opacity=".56" stroke-width="7" stroke-linecap="round"/>
    <rect x="38" y="228" width="164" height="44" rx="22" fill="#FF9D42" fill-opacity=".10" stroke="#FF9D42" stroke-opacity=".30"/>
    <circle cx="64" cy="250" r="7" fill="#FF9D42"/>
    <text x="83" y="256" fill="#FFD39B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">ARCHIVE READY</text>
  </g>
</g>
</svg>