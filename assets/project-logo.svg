<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Smart Compressor logo</title>
<desc id="desc">A compact archive core with converging compression rails in cyan and copper.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071116"/>
    <stop offset="1" stop-color="#112A34"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5AF2E9"/>
    <stop offset="1" stop-color="#16BFC4"/>
  </linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFC06A"/>
    <stop offset="1" stop-color="#FF8B2C"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity=".48"/>
  </filter>
</defs>

