[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-compressor"
version = "1.0.0"
description = "Safe, dependency-free local compression toolkit for files and directories."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["compression", "archive", "zip", "gzip", "tar", "cli"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
smart-compressor = "smart_compressor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
