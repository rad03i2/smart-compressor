name: Bug report
description: Report reproducible Smart Compressor behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please use a small archive containing non-sensitive test data. Do not upload private archives or exploitable samples publicly.
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu / macOS"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "smart-compressor inspect archive.zip"
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Archive format / suffix
      placeholder: ".zip / .tar.xz / .gz"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have not included private archives, credentials, or sensitive data.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
